INHERIT: nav.md

site_name: 王涛的博客
site_url: https://wangtaoknight.github.io/My-Blog/
site_author: TaoWang
site_description: 个人学习博客

repo_name: My-Blog
repo_url: https://github.com/wangtaoknight/My-Blog/

copyright: Copyright &copy; 2021-present <a href="https://github.com/wangtaoknight" target="_blank" rel="noopener noreferrer">wangtaoknight</a>

theme:
  name: material
  language: zh
  static_templates:
    - 404.html
  favicon: images/favicon.ico
  logo: images/logo.png
  apple-touch-icon-precomposed: images/mobile_icon.png
  include_search_page: false
  search_index_only: true

  features:
    - header.autohide
    - navigation.tracking
    - navigation.top
    # - navigation.tabs          # 顶部一级导航
    - navigation.sections      # 侧边栏分组
    # - navigation.footer        # 页脚上一页/下一页

    - toc.follow               # 右侧目录跟随滚动
    - content.code.copy        # 代码块一键复制
    # - content.action.edit      # 页面右上角“编辑此页”
    - search.highlight
    - search.share
    - search.suggest
    - content.code.annotate

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  font:
    text: Roboto Slab
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github

  custom_dir: overrides

markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes
  - admonition
  - toc:
      permalink: false

plugins:
  - i18n:
      languages:
        - locale: zh
          default: true
          name: 简体中文
          build: true
        - locale: en
          name: English
          build: true
          site_name: Tao Wang's Blog
          nav_translations:
            首页: Home
            文章: Posts
            关于: About
            红楼梦: Dream of the Red Chamber
            使用说明: Guide
  - search:
      lang:
        - zh
        - en
  - git-revision-date
  - minify:
      minify_html: true
  - open-in-new-tab

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wangtaoknight
  # 如需统计，请替换为你自己的 Google Analytics ID
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
